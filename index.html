<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SSP — Tosh, Qaychi, Qog'oz Onlayn O'yini</title>
  <meta name="description" content="SSP — Tosh, Qaychi, Qog'oz onlayn veb-o'yini: umumiy reyting, login/parol, rasm yuklash, fon musiqasi va 3 xil o'yin rejimi." />
  <style>
    :root {
      --bg1: #090d16;
      --bg2: #111827;
      --card: rgba(17, 24, 39, 0.78);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --accent2: #818cf8;
      --good: #34d399;
      --bad: #f87171;
      --warn: #fbbf24;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 15% 15%, #1e293b 0%, var(--bg1) 55%, #05080f 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .app {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #090d16;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    h1 { margin: 0; font-size: 20px; }
    .audio-bar {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 14px;
      margin-bottom: 16px;
    }
    .audio-bar button, .audio-bar select {
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 8px;
      margin: 0;
      width: auto;
    }
    .status-bar {
      min-height: 20px;
      font-size: 13px;
      text-align: center;
      margin-bottom: 10px;
      color: var(--warn);
    }
    .hidden { display: none !important; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
    input, select, button {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }
    input, select {
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
    }
    input:focus, select:focus { border-color: var(--accent); }
    button {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      font-weight: 600;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { filter: brightness(1.1); transform: translateY(-1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-sec { background: rgba(51, 65, 85, 0.85); }
    .btn-danger { background: rgba(220, 38, 38, 0.8); }
    .avatar-box {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
      background: rgba(15, 23, 42, 0.65);
      padding: 10px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }
    .avatar-preview {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      object-fit: cover;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      border: 2px solid var(--accent);
      flex-shrink: 0;
      overflow: hidden;
    }
    .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
    .preset-avatars { display: flex; gap: 6px; margin-top: 6px; }
    .preset-btn {
      width: 34px; height: 34px; padding: 0; margin: 0;
      border-radius: 50%; background: #1e293b; font-size: 18px;
    }
    .profile-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.8);
      padding: 12px;
      border-radius: 16px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .modes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 10px 0 14px;
    }
    .mode-btn {
      margin: 0;
      padding: 10px 6px;
      font-size: 13px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--border);
    }
    .mode-btn.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent);
      color: var(--accent);
    }
    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 14px 0;
    }
    .choice-btn {
      margin: 0;
      padding: 18px 8px;
      font-size: 16px;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid rgba(56, 189, 248, 0.35);
    }
    .choice-btn:hover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.16);
    }
    .choice-emoji { font-size: 30px; display: block; margin-bottom: 4px; }
    .result-box {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      min-height: 78px;
    }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 12px;
      text-align: center;
    }
    .stat-pill {
      background: rgba(30, 41, 59, 0.65);
      padding: 8px 4px;
      border-radius: 10px;
      font-size: 12px;
    }
    .stat-pill strong { display: block; font-size: 16px; margin-top: 2px; }
    .table-wrap {
      max-height: 330px;
      overflow-y: auto;
      margin-top: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 9px 8px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.07); }
    th { background: rgba(15, 23, 42, 0.95); color: var(--accent); position: sticky; top: 0; }
    .user-cell { display: flex; align-items: center; gap: 8px; }
    .mini-avatar {
      width: 28px; height: 28px; border-radius: 50%; object-fit: cover;
      background: #1e293b; display: inline-flex; align-items: center; justify-content: center;
      font-size: 14px; overflow: hidden; flex-shrink: 0;
    }
    .mini-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .timer-badge {
      display: inline-block;
      background: rgba(251, 191, 36, 0.18);
      color: var(--warn);
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="brand">
        <span class="badge">SSP</span>
        <h1>Tosh, Qaychi, Qog'oz</h1>
      </div>
      <span id="dbStatus" style="font-size:12px; color:#34d399;">● Supabase</span>
    </div>

    <div class="audio-bar">
      <button id="musicToggle" class="btn-sec" onclick="toggleMusic()">🎵 Musiqa: O'chiq</button>
      <select id="trackSelect" onchange="changeTrack()">
        <option value="0">Trek 1: Kosmik Tinch</option>
        <option value="1">Trek 2: Retro Arkada</option>
        <option value="2">Trek 3: Fokus Ritm</option>
      </select>
      <button id="sfxToggle" class="btn-sec" onclick="toggleSfx()">🔊 Effektlar: Yoniq</button>
    </div>

    <div id="statusMsg" class="status-bar"></div>

    <!-- KIRISH / RO'YXATDAN O'TISH -->
    <div id="authView">
      <label>Foydalanuvchi nomi (Login)</label>
      <input type="text" id="loginUser" placeholder="Masalan: Izzatillo" maxlength="20" />

      <label>Parol</label>
      <input type="password" id="loginPass" placeholder="Parolingizni kiriting" maxlength="30" />

      <label>Shaxsiy rasm yoki avatar (ixtiyoriy)</label>
      <div class="avatar-box">
        <div id="avatarPreview" class="avatar-preview">😎</div>
        <div style="flex:1;">
          <input type="file" id="avatarFile" accept="image/*" style="padding:6px; font-size:12px;" onchange="handleImageUpload(event)" />
          <div class="preset-avatars">
            <button type="button" class="preset-btn" onclick="setEmojiAvatar('😎')">😎</button>
            <button type="button" class="preset-btn" onclick="setEmojiAvatar('🥷')">🥷</button>
            <button type="button" class="preset-btn" onclick="setEmojiAvatar('🦁')">🦁</button>
            <button type="button" class="preset-btn" onclick="setEmojiAvatar('🚀')">🚀</button>
            <button type="button" class="preset-btn" onclick="setEmojiAvatar('👑')">👑</button>
          </div>
        </div>
      </div>

      <button id="authBtn" onclick="loginOrRegister()">🚀 Kirish / Ro'yxatdan o'tish</button>
      <button class="btn-sec" onclick="openLeaderboard()">🏆 Umumiy reytingni ko'rish</button>
    </div>

    <!-- O'YIN BO'LIMI -->
    <div id="gameView" class="hidden">
      <div class="profile-card">
        <div class="user-cell">
          <div id="playerAvatar" class="avatar-preview" style="width:44px; height:44px; font-size:20px;">😎</div>
          <div>
            <strong id="playerNameDisplay" style="font-size:16px;">O'yinchi</strong>
            <div style="font-size:12px; color:var(--muted);" id="modeDesc">Oddiy rejim</div>
          </div>
        </div>
        <div style="display:flex; gap:6px;">
          <button class="btn-sec" style="margin:0; padding:8px 10px; font-size:13px;" onclick="openLeaderboard()">🏆 Reyting</button>
          <button class="btn-danger" style="margin:0; padding:8px 10px; font-size:13px;" onclick="logout()">Chiqish</button>
        </div>
      </div>

      <div class="modes">
        <button id="mode0" class="mode-btn active" onclick="setMode(0)">1. Oddiy</button>
        <button id="mode1" class="mode-btn" onclick="setMode(1)">2. Tezkor (5s)</button>
        <button id="mode2" class="mode-btn" onclick="setMode(2)">3. Cheksiz xato</button>
      </div>

      <div style="text-align:center;">
        <span id="timerBadge" class="timer-badge hidden">⏱ Qolgan vaqt: 5s</span>
      </div>

      <div class="choices">
        <button class="choice-btn" onclick="playRound('Tosh')">
          <span class="choice-emoji">🪨</span>Tosh
        </button>
        <button class="choice-btn" onclick="playRound('Qaychi')">
          <span class="choice-emoji">✂️</span>Qaychi
        </button>
        <button class="choice-btn" onclick="playRound('Qog\'oz')">
          <span class="choice-emoji">📄</span>Qog'oz
        </button>
      </div>

      <div id="resultBox" class="result-box">
        Yurish qilish uchun yuqoridagi tugmalardan birini bosing!
      </div>

      <div class="stats-row">
        <div class="stat-pill">G'alaba<strong id="statWins" style="color:var(--good);">0</strong></div>
        <div class="stat-pill">Mag'lubiyat<strong id="statLosses" style="color:var(--bad);">0</strong></div>
        <div class="stat-pill">Durang<strong id="statDraws" style="color:var(--accent);">0</strong></div>
        <div class="stat-pill">Xato urinish<strong id="statMistakes" style="color:var(--warn);">0</strong></div>
      </div>
    </div>

    <!-- REYTING BO'LIMI -->
    <div id="leaderboardView" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="margin:0;">🏆 Umumiy Reyting (Barcha qurilmalar)</h3>
        <button class="btn-sec" style="width:auto; margin:0; padding:6px 12px; font-size:13px;" onclick="loadLeaderboard()">🔄 Yangilash</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>O'yinchi</th>
              <th>G'alaba</th>
              <th>Mag'lub.</th>
              <th>Durang</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody">
            <tr><td colspan="5" style="text-align:center;">Yuklanmoqda...</td></tr>
          </tbody>
        </table>
      </div>
      <button class="btn-sec" onclick="backFromLeaderboard()">⬅️ Orqaga</button>
    </div>
  </div>

  <script>
    // Sizning Supabase sozlamalaringiz (hech narsani o'zgartirish shart emas)
    const SUPABASE_URL = "https://avwsdynzohjmxkfkgvhmn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_8UpSKkjX2KBg4FEW6HCV3Q_f8g1HIzY";
    const TABLE_NAME = "reyting";

    let currentUser = null;
    let selectedAvatar = "😎";
    let gameMode = 0; // 0: Oddiy, 1: Tezkor (5s), 2: Cheksiz xato
    let mistakeCounter = 0;
    let timerInterval = null;
    let timeLeft = 5;
    let supportsPasswordColumn = true;

    // --- WEB AUDIO (FON MUSIQASI VA OVOZ EFFEKTLARI) ---
    let audioCtx = null;
    let musicOn = false;
    let sfxOn = true;
    let musicTimer = null;
    let stepIdx = 0;

    const tracks = [
      [261.63, 329.63, 392.00, 493.88, 392.00, 329.63],
      [329.63, 392.00, 523.25, 493.88, 392.00, 349.23],
      [220.00, 261.63, 329.63, 293.66, 261.63, 246.94]
    ];

    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function playTone(freq, duration = 0.18, type = "sine", vol = 0.05) {
      try {
        ensureAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function toggleMusic() {
      musicOn = !musicOn;
      document.getElementById("musicToggle").textContent = musicOn ? "🎵 Musiqa: Yoniq" : "🎵 Musiqa: O'chiq";
      if (musicOn) {
        ensureAudio();
        startMusicLoop();
      } else {
        clearInterval(musicTimer);
      }
    }

    function changeTrack() {
      stepIdx = 0;
      if (musicOn) startMusicLoop();
    }

    function startMusicLoop() {
      clearInterval(musicTimer);
      const trackNum = parseInt(document.getElementById("trackSelect").value, 10) || 0;
      const notes = tracks[trackNum];
      musicTimer = setInterval(() => {
        if (!musicOn) return;
        const note = notes[stepIdx % notes.length];
        playTone(note, 0.35, "triangle", 0.035);
        stepIdx++;
      }, 420);
    }

    function toggleSfx() {
      sfxOn = !sfxOn;
      document.getElementById("sfxToggle").textContent = sfxOn ? "🔊 Effektlar: Yoniq" : "🔇 Effektlar: O'chiq";
    }

    function playSfx(kind) {
      if (!sfxOn) return;
      if (kind === "win") {
        playTone(523.25, 0.14, "sine", 0.08);
        setTimeout(() => playTone(659.25, 0.2, "sine", 0.08), 110);
      } else if (kind === "lose") {
        playTone(246.94, 0.18, "sawtooth", 0.05);
        setTimeout(() => playTone(196.00, 0.24, "sawtooth", 0.05), 130);
      } else {
        playTone(392.00, 0.12, "triangle", 0.06);
      }
    }

    // --- YORDAMCHI FUNKSIYALAR ---
    function showStatus(msg, isError = false) {
      const el = document.getElementById("statusMsg");
      el.style.color = isError ? "#f87171" : "#34d399";
      el.textContent = msg;
      if (msg) {
        setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, 4500);
      }
    }

    function renderAvatarHTML(avatarVal) {
      if (avatarVal && avatarVal.startsWith("data:image")) {
        return `<img src="${avatarVal}" alt="avatar" />`;
      }
      return avatarVal || "😎";
    }

    function setEmojiAvatar(emoji) {
      selectedAvatar = emoji;
      document.getElementById("avatarPreview").innerHTML = emoji;
    }

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const size = 96;
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, size, size);
          selectedAvatar = canvas.toDataURL("image/jpeg", 0.72);
          document.getElementById("avatarPreview").innerHTML = renderAvatarHTML(selectedAvatar);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function switchView(viewId) {
      ["authView", "gameView", "leaderboardView"].forEach(id => {
        document.getElementById(id).classList.add("hidden");
      });
      document.getElementById(viewId).classList.remove("hidden");
    }

    // --- SUPABASE REST API SO'ROVLARI ---
    function sbHeaders(prefer = "return=representation") {
      return {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json",
        "Prefer": prefer
      };
    }

    async function sbFetch(path, options = {}) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
        ...options,
        headers: { ...sbHeaders(), ...(options.headers || {}) }
      });
      if (!res.ok) {
        const errText = await res.text();
        throw new Error(errText || `HTTP ${res.status}`);
      }
      const text = await res.text();
      return text ? JSON.parse(text) : null;
    }

    // --- LOGIN VA RO'YXATDAN O'TISH ---
    async function loginOrRegister() {
      const username = document.getElementById("loginUser").value.trim();
      const password = document.getElementById("loginPass").value.trim();

      if (!username || !password) {
        showStatus("Iltimos, login va parolni kiriting!", true);
        return;
      }

      const btn = document.getElementById("authBtn");
      btn.disabled = true;
      btn.textContent = "Tekshirilmoqda...";

      try {
        const encoded = encodeURIComponent(username);
        const existing = await sbFetch(`${TABLE_NAME}?username=eq.${encoded}&select=*`);

        if (existing && existing.length > 0) {
          const user = existing[0];
          if (user.password && user.password !== password) {
            showStatus("Parol noto'g'ri! Boshqa parol kiriting.", true);
            btn.disabled = false;
            btn.textContent = "🚀 Kirish / Ro'yxatdan o'tish";
            return;
          }
          currentUser = user;
          if (selectedAvatar && selectedAvatar.startsWith("data:image")) {
            await sbFetch(`${TABLE_NAME}?id=eq.${user.id}`, {
              method: "PATCH",
              body: JSON.stringify({ avatar: selectedAvatar })
            });
            currentUser.avatar = selectedAvatar;
          }
          showStatus(`Xush kelibsiz, ${currentUser.username}!`);
        } else {
          // Yangi foydalanuvchi yaratish
          const payload = {
            username,
            wins: 0,
            losses: 0,
            draws: 0,
            avatar: selectedAvatar
          };
          if (supportsPasswordColumn) payload.password = password;

          let created;
          try {
            created = await sbFetch(TABLE_NAME, {
              method: "POST",
              body: JSON.stringify(payload)
            });
          } catch (e) {
            // Agar jadvalda password ustuni bo'lmasa, parolsiz saqlaydi
            supportsPasswordColumn = false;
            delete payload.password;
            created = await sbFetch(TABLE_NAME, {
              method: "POST",
              body: JSON.stringify(payload)
            });
          }
          currentUser = created[0];
          showStatus(`Yangi akkaunt yaratildi: ${currentUser.username}!`);
        }

        enterGame();
      } catch (err) {
        console.error(err);
        showStatus("Supabase ulanishida xato: " + err.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = "🚀 Kirish / Ro'yxatdan o'tish";
      }
    }

    function enterGame() {
      mistakeCounter = 0;
      document.getElementById("playerNameDisplay").textContent = currentUser.username;
      document.getElementById("playerAvatar").innerHTML = renderAvatarHTML(currentUser.avatar);
      updateStatsUI();
      setMode(0);
      switchView("gameView");
    }

    function logout() {
      clearInterval(timerInterval);
      currentUser = null;
      switchView("authView");
    }

    function updateStatsUI() {
      if (!currentUser) return;
      document.getElementById("statWins").textContent = currentUser.wins || 0;
      document.getElementById("statLosses").textContent = currentUser.losses || 0;
      document.getElementById("statDraws").textContent = currentUser.draws || 0;
      document.getElementById("statMistakes").textContent = mistakeCounter;
    }

    // --- 3 XIL O'YIN REJIMI ---
    function setMode(mode) {
      gameMode = mode;
      [0, 1, 2].forEach(i => {
        document.getElementById(`mode${i}`).classList.toggle("active", i === mode);
      });

      const descs = [
        "1-rejim: Oddiy klassik o'yin",
        "2-rejim: Tezkor (har yurishga 5 soniya)",
        "3-rejim: Cheksiz xato qilish imkoniyati (to'xtovsiz mashq)"
      ];
      document.getElementById("modeDesc").textContent = descs[mode];

      clearInterval(timerInterval);
      const timerBadge = document.getElementById("timerBadge");
      if (mode === 1) {
        timerBadge.classList.remove("hidden");
        resetSpeedTimer();
      } else {
        timerBadge.classList.add("hidden");
      }
    }

    function resetSpeedTimer() {
      clearInterval(timerInterval);
      timeLeft = 5;
      const timerBadge = document.getElementById("timerBadge");
      timerBadge.textContent = `⏱ Qolgan vaqt: ${timeLeft}s`;
      timerInterval = setInterval(() => {
        if (!currentUser || gameMode !== 1) {
          clearInterval(timerInterval);
          return;
        }
        timeLeft--;
        timerBadge.textContent = `⏱ Qolgan vaqt: ${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          handleTimeoutLoss();
        }
      }, 1000);
    }

    async function handleTimeoutLoss() {
      mistakeCounter++;
      currentUser.losses = (currentUser.losses || 0) + 1;
      playSfx("lose");
      document.getElementById("resultBox").innerHTML =
        `<span style="color:var(--bad); font-weight:700;">⏰ Vaqt tugadi!</span><br>5 soniya ichida yurish qilmadingiz (+1 mag'lubiyat).`;
      updateStatsUI();
      await syncUserStats();
      if (gameMode === 1) resetSpeedTimer();
    }

    // --- O'YIN JARAYONI ---
    async function playRound(playerChoice) {
      if (!currentUser) return;
      if (gameMode === 1) resetSpeedTimer();

      const options = ["Tosh", "Qaychi", "Qog'oz"];
      const botChoice = options[Math.floor(Math.random() * options.length)];

      let outcomeText = "";
      let outcomeColor = "var(--accent)";

      if (playerChoice === botChoice) {
        currentUser.draws = (currentUser.draws || 0) + 1;
        outcomeText = "🤝 Durang!";
        playSfx("draw");
      } else if (
        (playerChoice === "Tosh" && botChoice === "Qaychi") ||
        (playerChoice === "Qaychi" && botChoice === "Qog'oz") ||
        (playerChoice === "Qog'oz" && botChoice === "Tosh")
      ) {
        currentUser.wins = (currentUser.wins || 0) + 1;
        outcomeText = "🎉 Siz yutdingiz!";
        outcomeColor = "var(--good)";
        playSfx("win");
      } else {
        mistakeCounter++;
        currentUser.losses = (currentUser.losses || 0) + 1;
        outcomeText = gameMode === 2
          ? "♾️ Xato qildingiz, lekin o'yin davom etadi!"
          : "💻 Kompyuter yutdi!";
        outcomeColor = "var(--bad)";
        playSfx("lose");
      }

      document.getElementById("resultBox").innerHTML = `
        <div style="font-size:14px; color:var(--muted);">Siz: <strong style="color:#fff;">${playerChoice}</strong> &nbsp;|&nbsp; Kompyuter: <strong style="color:#fff;">${botChoice}</strong></div>
        <div style="font-size:18px; font-weight:700; color:${outcomeColor}; margin-top:6px;">${outcomeText}</div>
      `;

      updateStatsUI();
      await syncUserStats();
    }

    async function syncUserStats() {
      if (!currentUser || !currentUser.id) return;
      try {
        await sbFetch(`${TABLE_NAME}?id=eq.${currentUser.id}`, {
          method: "PATCH",
          body: JSON.stringify({
            wins: currentUser.wins,
            losses: currentUser.losses,
            draws: currentUser.draws
          })
        });
      } catch (err) {
        showStatus("Natija bazaga yozilmadi: " + err.message, true);
      }
    }

    // --- UMUMIY REYTING ---
    async function openLeaderboard() {
      clearInterval(timerInterval);
      switchView("leaderboardView");
      await loadLeaderboard();
    }

    function backFromLeaderboard() {
      if (currentUser) {
        switchView("gameView");
        if (gameMode === 1) resetSpeedTimer();
      } else {
        switchView("authView");
      }
    }

    async function loadLeaderboard() {
      const tbody = document.getElementById("leaderboardBody");
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Yuklanmoqda...</td></tr>`;

      try {
        const rows = await sbFetch(`${TABLE_NAME}?select=*&order=wins.desc,draws.desc`);
        if (!rows || rows.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Hozircha o'yinchilar yo'q</td></tr>`;
          return;
        }

        tbody.innerHTML = rows.map((u, idx) => `
          <tr>
            <td><strong>${idx + 1}</strong></td>
            <td>
              <div class="user-cell">
                <span class="mini-avatar">${renderAvatarHTML(u.avatar)}</span>
                <span>${escapeHtml(u.username || "Noma'lum")}</span>
              </div>
            </td>
            <td style="color:var(--good); font-weight:700;">${u.wins || 0}</td>
            <td style="color:var(--bad);">${u.losses || 0}</td>
            <td style="color:var(--accent);">${u.draws || 0}</td>
          </tr>
        `).join("");
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#f87171;">Xato: ${escapeHtml(err.message)}</td></tr>`;
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[s]));
    }
  </script>
</body>
</html>
